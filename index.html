<script>
(()=>{'use strict';
const $=id=>document.getElementById(id); const canvas=$('world'),ctx=canvas.getContext('2d'); const W=23,H=18; let vw=0,vh=0,dpr=1,sc=1,ox=0,oy=0,tw=55,th=28;const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const roll=()=>Math.random();
const missions=[
{title:'接下今天的工作',hint:'跟陳場長確認交班板，別急著開始。',place:'辦公室',node:'manager',time:'04:00',scene:'第一章｜第一道燈',desc:'昨天有總生菌數上升的紀錄，凌晨也傳來冷卻警報。今天不是要你一個人解決所有事情，而是要把風險交給對的人。',say:'陳場長：「先看交班，不用急著跑。你接到的是事情，不是答案。」',options:[{t:'確認每張工作卡的責任人、時間及處置狀態',effects:{team:8,energy:2},reply:'交接資料整理好了。阿哲放心把工作交給你，下一站先去看冷卻槽。',good:true},{t:'把所有提醒一鍵標成已完成，趕快出發',effects:{team:-9,milk:-5},reply:'「已讀」不代表問題已解決。阿哲要求補上責任人與下一次更新時間。'}]},
{title:'13.8°C 的冷卻警報',hint:'先讀冷卻曲線與異常紀錄，不要急著按 Reset。',place:'儲乳槽',node:'tank',time:'04:20',scene:'第一章｜乳質危機',desc:'昨夜儲乳槽一度顯示 13.8°C 的警報紀錄（虛構劇情數值）。設備可能曾短暫停轉，06:30 收乳車就要到；今天的乳品不能靠猜測放行。',say:'阿力：「師傅不在，阿伯又很在意那槽奶。你要不要先按那顆紅色的鍵？」',options:[{t:'保留溫度曲線、管制待確認批次，聯繫品管與設備人員',effects:{milk:12,team:3,energy:-3},reply:'設備問題交給有權限的人排查，生乳批次保留待確認狀態。安全守住了，但還需要後續結果。',good:true},{t:'直接復歸警報，溫度降下來就當沒事',effects:{milk:-22,team:-10},reply:'警報解除不代表品質沒風險，溫度歷史也不該刪除。這筆未完成事件會留到收乳查核。'},{t:'把冰塊倒進原奶緊急降溫',effects:{milk:-28,team:-12},reply:'⚠️ 不可向生乳加入冰塊或其他水源。高風險做法在遊戲中被阻止，仍須啟動正確通報。'}]},
{title:'美玲姐的晨間擠乳',hint:'進入擠乳室，用滑鼠／手指完成四步驟工作卡。',place:'擠乳室',node:'milker',time:'05:10',scene:'第一章｜第一次擠乳',desc:'88 號母牛甩了一下尾巴，擠乳杯叮叮響。美玲姐決定讓你跟著現場示範做一輪。',say:'美玲姐：「先認牛，再照場內 SOP 走，快沒有用，穩才有用。」',type:'sequence',steps:['核對耳標及個體狀態','依核定 SOP 完成乳頭前處理','確認乳頭充分乾燥','依場內標準完成上杯'],reward:{milk:10,team:5,energy:-4}},
{title:'F017 為什麼不想吃？',hint:'到 Fresh Cow 牛舍觀察產後牛。',place:'Fresh 牛舍',node:'fresh',time:'07:15',scene:'第二章｜牛群留下線索',desc:'產後牛 F017 的飼槽剩料增加，反芻紀錄也有變動。阿豪問你是不是酮病；旁邊的母牛依然安靜地咀嚼。',say:'阿豪：「牠昨天也吃得少，你覺得是哪一種病？我可以先幫你記下來。」',options:[{t:'先核對產後天數、個體資料與可見徵象，再請獸醫評估',effects:{cow:13,team:4,energy:-3},reply:'F017 已建立追蹤卡。你沒有亂猜病名，夜班也能依耳標及時間接續觀察。',good:true},{t:'光憑食慾下降就認定酮病，直接安排用藥',effects:{cow:-17,team:-6},reply:'採食下降可能有多種原因，未經評估自行用藥不適當。美玲姐要求你補全觀察資料。'},{t:'等明天再說，不需要留下紀錄',effects:{cow:-12,team:-7,energy:3},reply:'這頭牛的異常沒有交給任何負責人。晚班會因此收到不完整的追蹤工作。'}]},
{title:'TMR 車發出奇怪聲音',hint:'前往飼料區，先確認設備及原料狀況。',place:'TMR 飼料區',node:'feed',time:'10:30',scene:'第三章｜一口飼料的旅程',desc:'TMR 攪拌機剛啟動就傳出不正常的金屬聲，阿豪正想把手探進附近的入料區。配方單上還有一筆原料批次尚未確認。',say:'阿豪：「完蛋了，牛快要吃飯，我可不可以進去把卡住的東西拿出來？」',options:[{t:'提醒停止靠近危險部位，依設備安全程序由受訓人員處理，安排備援餵料',effects:{cow:9,team:9,energy:-6},reply:'處理不是最快，但人員安全、餵飼安排和原料批號都留下紀錄。真正的異物原因交給技師確認。',good:true},{t:'趁機器還轉著，自己伸手把草料拉出來',effects:{cow:-14,team:-22,energy:-14},reply:'⚠️ 危險操作被系統阻止。機械安全不能賭運氣，任務轉為安全複訓與延誤。'},{t:'不理會異音，繼續把沒混勻的飼料送出去',effects:{cow:-13,team:-7,milk:-3},reply:'供料品質有疑慮卻沒有停止與查核。下午將出現未完成餵飼追蹤。'}]},
{title:'午後高溫挑戰',hint:'調查通風、噴淋與飲水，不只看溫度。',place:'環控設備區',node:'heat',time:'13:30',scene:'第四章｜熱、雨與停下來',desc:'部分牛隻呼吸明顯加快，水槽附近擠滿牛。風扇與噴淋設備顯示不同狀態。你只能優先安排一項查核工作。',say:'阿力：「要不然把水開到最大？我覺得大家都很熱！」',options:[{t:'核對供水、風扇及牛隻反應，通知授權人員依本場 SOP 調整',effects:{cow:14,team:5,energy:-4},reply:'優先查核供水與散熱條件，留下改善後的行為觀察計畫。不能保證乳量立刻回升。',good:true},{t:'只讓細霧連續噴整個下午，其他都不管',effects:{cow:-17,team:-3},reply:'高濕環境下不當噴霧可能增加熱負荷。實際降溫方式必須配合通風與設施設計。'},{t:'等太陽下山就會涼，先休息',effects:{cow:-13,energy:5},reply:'需要處理的環境風險被延後，夜班多了一份待確認的牛群狀態追蹤。'}]},
{title:'下午擠乳的紅色警訊',hint:'回到擠乳室，核對 308 號治療牛身分。',place:'擠乳室',node:'milker',time:'16:00',scene:'第五章｜第二次擠乳',desc:'308 號治療牛身上的紅腳帶磨掉了，牠正被帶往待擠牛群。今天的問題不是速度，而是要在乳汁混入前完成辨識與分流。',say:'美玲姐：「腳帶是提醒，牛號和用藥紀錄一定要對得上！」',options:[{t:'核對耳標及治療紀錄，提醒停下並依程序分流／管制待確認乳品',effects:{milk:18,team:8,energy:-5},reply:'成功守住交接節點。必要批次將按品質程序確認，不能把「看起來沒事」當成安全放行。',good:true},{t:'紅腳帶不見就是沒治療，不用查',effects:{milk:-26,team:-8},reply:'乳品安全重大紅線：只靠腳帶顏色不能確認停藥期或乳品去向。受影響批次必須通報管制。'},{t:'讓牠先擠，混在一大槽應該驗不出來',effects:{milk:-40,team:-19},reply:'⚠️ 絕不能以稀釋規避藥物殘留檢測。系統阻止此行為並記錄重大安全缺失。'}]},

function tank(x,y){const p=proj(x+.5,y+.55),r=tw*.36;ctx.fillStyle='#294f5350';ctx.beginPath();ctx.ellipse(p.x,p.y+5,r+3,9,0,0,7);ctx.fill();ctx.fillStyle='#b8cdd1';ctx.fillRect(p.x-r,p.y-r*2.4,r*2,r*2.2);ctx.fillStyle='#e8eff0';ctx.beginPath();ctx.ellipse(p.x,p.y-r*2.4,r,r*.43,0,0,7);ctx.fill();ctx.fillStyle='#8eabb1';ctx.beginPath();ctx.ellipse(p.x,p.y-r*.2,r,r*.43,0,0,7);ctx.fill();ctx.fillStyle='#567d89';ctx.fillRect(p.x-r*.4,p.y-r*1.7,r*.8,r*.48);ctx.fillStyle='#fff';ctx.font='bold '+(9*sc)+'px monospace';ctx.textAlign='center';ctx.fillText('TEMP',p.x,p.y-r*1.34)}
function flag(x,y){const p=proj(x+.5,y+.5);ctx.fillStyle='#d2e3bd';ctx.fillRect(p.x-4,p.y-22,7,23);ctx.fillStyle='#eea94c';ctx.fillRect(p.x,p.y-22,15,10)}
function fan(x,y){const p=proj(x+.5,y+.5);ctx.fillStyle='#42685d';ctx.fillRect(p.x-3,p.y-17,6,19);ctx.fillStyle='#7aa7a7';ctx.fillRect(p.x-17,p.y-37,34,25);ctx.fillStyle='#e1e4be';ctx.beginPath();ctx.arc(p.x,p.y-25,11,0,7);ctx.fill();ctx.strokeStyle='#53848a';ctx.lineWidth=3;for(let i=0;i<4;i++){let ang=i*Math.PI/2+animation/700;ctx.beginPath();ctx.moveTo(p.x,p.y-25);ctx.lineTo(p.x+Math.cos(ang)*10,p.y-25+Math.sin(ang)*10);ctx.stroke()}}
function mark(x,y,primary){const p=proj(x+.5,y+.5);const bob=Math.sin(animation/310)*3;ctx.fillStyle=primary?'#ffd74e':'#a7ed9b';ctx.strokeStyle='#5a4323';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(p.x-12,p.y-75+bob,24,27,4);ctx.fill();ctx.stroke();ctx.textAlign='center';ctx.font='900 '+(20*sc)+'px system-ui';ctx.fillStyle='#3b442d';ctx.fillText(primary?'!':'?',p.x,p.y-54+bob)}
function worldDecor(){ // static buildings and props, each represented by chunky simple voxels
box(2,2,5,3,2.6,'#e5ab68','#e9dcb1','#c99d6e');box(2.5,2,4,3,2.85,'#a45b43','#934635','#b5714c');
box(7,2,5,3,.4,'#c9c8b4','#aba793','#a29d88');
box(15,2,6,3,.38,'#a58b5d','#957753','#b99b69');for(let i=0;i<3;i++)box(15.4+i*1.3,2.4,.95,.95,1,'#d5b571','#b79052','#c9a568');
box(3,8,8,3,.27,'#c6bc9c','#aca485','#a29b7c');for(let i=0;i<4;i++){const x=3.8+i*1.5;box(x,8.25,.18,2.2,1.8,'#bfc9c0','#7f928e','#849c91')}
box(14,7,7,4,.32,'#c8bb94','#ad9f7e','#b3a484');for(let i=0;i<5;i++)box(14.25+i*1.3,7.5,.16,2.5,.9,'#e9e6d1','#bdcabb','#acc2b1');
box(14,12,7,4,.3,'#cfc49d','#b5a77d','#ada17e');for(let i=0;i<4;i++)box(14.4+i*1.5,12.5,.1,2.4,1.2,'#e5e0cb','#c9c6b0','#c1c4af');
// silos at top edge
for(let i=0;i<3;i++){const x=9+i*1.1,y=1;box(x,y,.8,.8,3.8,'#bbc3a8','#889e90','#a9baa6')}for(let i=0;i<3;i++)box(18+i*.85,1,.65,.7,1.2,'#c3a26a','#a8885c','#d2b47a');
}
function draw(){ctx.clearRect(0,0,vw,vh);ctx.fillStyle='#8bbed0';ctx.fillRect(0,0,vw,vh);ctx.fillStyle='#507f83';ctx.fillRect(0,vh*.7,vw,vh*.3);ctx.save();ctx.translate(0,0);for(let layer=0;layer<W+H-1;layer++)for(let x=0;x<W;x++){let y=layer-x;if(y>=0&&y<H)tile(x,y)}worldDecor();
// zone decorations
for(let [x,y] of [[4.2,9.1],[5.8,9.2],[7.3,9.15],[8.6,9.3],[16,8.3],[18,8.2],[19.5,8.3],[16,13.8],[17.3,14.4]])cow(x,y);
for(const [x,y] of [[13,3],[13,4],[13,12],[13,13],[7,7],[10,7]]){const p=proj(x+.5,y+.5);ctx.fillStyle='#507e5b';ctx.fillRect(p.x-3,p.y-11,6,11);ctx.fillStyle='#42794a';ctx.fillRect(p.x-8,p.y-17,16,11)}
// noncurrent figures: office, feed, employee, etc
human(5,5,'#b7634c');human(19,5,'#407eb0');human(10,11,'#aa587d');human(5,15,'#926947');human(15,15,'#83a55f');
// tank, wagon and actual room elements
 tank(9.1,3.1);box(18,3.5,2,1,.8,'#5f937b','#335e56','#4d817a');fan(19.7,13.2);
// extra scene objects
for(let [x,y] of [[16.5,11.2],[19.8,10.7]]){const p=proj(x,y);ctx.fillStyle='#6aa8c1';ctx.fillRect(p.x-16,p.y-13,30,12);ctx.fillStyle='#b8e3ec';ctx.fillRect(p.x-14,p.y-15,26,4)}
const spriteNodes=activeNodes();for(const n of spriteNodes){if(n.style==='cow')cow(n.x,n.y);else if(n.style==='tank')tank(n.x,n.y);else if(n.style==='fan')fan(n.x,n.y);else if(n.style==='flag')flag(n.x,n.y);mark(n.x,n.y,n.primary);const p=proj(n.x+.5,n.y+.5);label(n.label,p.x,p.y,n.primary)}human(s.x,s.y,'#2b76a2',true);ctx.restore()}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);vw=canvas.clientWidth;vh=canvas.clientHeight;canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);sc=clamp(Math.min(vw/1170,vh/720)*1.06,.65,1.45);tw=55*sc;th=28*sc;ox=vw*(vw<700?.52:.5);oy=Math.max(10,vh*(vw<700?.30:.13));draw()}
function animate(t){if(s.autoPath.length&&!($('overlay').classList.contains('hidden')===false)){if(t-s.lastMove>115){let step=s.autoPath.shift();s.x=step.x;s.y=step.y;s.lastMove=t;if(!s.autoPath.length){const ns=activeNodes().sort((a,b)=>Math.abs(a.x-s.x)+Math.abs(a.y-s.y)-Math.abs(b.x-s.x)-Math.abs(b.y-s.y));if(ns[0]&&Math.abs(ns[0].x-s.x)+Math.abs(ns[0].y-s.y)<=3){toast('已到附近！按 E 或點任務人物互動。')}}}}animation=t;draw();requestAnimationFrame(animate)}
function stepMove(dx,dy){if(!$('overlay').classList.contains('hidden')||!s.playing)return;s.autoPath=[];s.x=clamp(s.x+dx,1,W-2);s.y=clamp(s.y+dy,1,H-2);if(Math.random()<.12)save()}
window.addEventListener('keydown',e=>{if(!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){const dirs={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};if(dirs[e.key]){e.preventDefault();stepMove(...dirs[e.key])}if(['e','E',' ','Enter'].includes(e.key)&&$('overlay').classList.contains('hidden')){e.preventDefault();closest()}}});
let ptrDown=null;canvas.addEventListener('pointerdown',e=>{ptrDown={x:e.clientX,y:e.clientY,time:performance.now()}});canvas.addEventListener('pointerup',e=>{if(!$('overlay').classList.contains('hidden')||!s.playing)return;if(ptrDown&&Math.hypot(e.clientX-ptrDown.x,e.clientY-ptrDown.y)>20)return;const boxc=canvas.getBoundingClientRect();const mx=e.clientX-boxc.left,my=e.clientY-boxc.top;const ns=activeNodes().map(n=>({...n,point:proj(n.x+.5,n.y+.5)})).sort((a,b)=>Math.hypot(a.point.x-mx,a.point.y-42*sc-my)-Math.hypot(b.point.x-mx,b.point.y-42*sc-my));if(ns.length&&Math.hypot(ns[0].point.x-mx,ns[0].point.y-42*sc-my)<55*sc){interact(ns[0]);return}const isoX=(mx-ox)/(tw/2),isoY=(my-oy)/(th/2);const tx=Math.round((isoX+isoY)/2),ty=Math.round((isoY-isoX)/2);walkTo(tx,ty)});
for(const b of document.querySelectorAll('#dpad button')){let interval;const d=b.dataset.dir;const action=()=>{if(d==='e')closest();else {const dd={w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[d];stepMove(...dd)}};b.addEventListener('pointerdown',e=>{e.preventDefault();action();if(d!=='e')interval=setInterval(action,150)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(interval)))}
$('auto').onclick=()=>{if(s.over){finish();return}const n=nodeData[missions[s.stage].node];walkTo(n.x,n.y);toast('正在前往 '+n.label)};$('restart').onclick=()=>setDialog('重新開始','要開始新的一局嗎？','進度會清空，主線相同，但隨機支線可能不同。','',[{label:'確定，重新開始',click:()=>{reset();startDialog()}},{label:'取消，繼續遊玩',click:closeDialog}],s.clock);
$('records').onclick=()=>setDialog('牧場事件日誌','這一天發生了什麼？',s.log.map(t=>'• '+escapeHTML(t)).join('<br>'),'',[{label:'關閉，繼續探索',click:closeDialog}],s.clock);
window.addEventListener('resize',resize);resize();updateUI();if(load()){updateUI();setDialog('歡迎回來','繼續今天的值班','你先前的遊戲進度已自動保留。現在可以從上次的工作繼續。','',[{label:'繼續遊玩',click:closeDialog},{label:'重新開始',click:()=>{reset();startDialog()}}],s.clock)}else startDialog();requestAnimationFrame(animate);
})();
</script>
